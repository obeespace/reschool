name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stub @libsql/client workerd entry (missing file in package)
        run: |
          REAL_LIBSQL=$(readlink -f node_modules/@libsql/client)
          mkdir -p "$REAL_LIBSQL/lib-esm"
          printf 'export function createClient() { throw new Error("@libsql/client is not available in Cloudflare Workers"); }\n' > "$REAL_LIBSQL/lib-esm/web.js"
          echo "Stubbed: $REAL_LIBSQL/lib-esm/web.js"

      - name: Build for Cloudflare
        run: pnpm run build:cf
        env:
          CLOUDFLARE_BUILD: "1"

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
